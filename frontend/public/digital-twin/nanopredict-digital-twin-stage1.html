<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NanoPredict — Lithography Equipment Digital Twin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ebef; --panel:rgba(249,251,252,.9); --panel-line:#c6cfd7;
  --ink:#16202a; --ink-2:#4f5c68; --ink-3:#77838e;
  --accent:#0c7c86; --accent-ink:#ffffff; --accent-soft:#d7edef; --chip:#edf1f4;
  --ok:#1c9a70; --warn:#c98a00; --crit:#d2402c;
  --shadow:0 6px 22px rgba(28,40,52,.13);
  --tag-bg:rgba(255,255,255,.94); --tag-ink:#17222c; --leader:#1d2a36;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a2026; --panel:rgba(24,30,37,.9); --panel-line:#36414b;
    --ink:#e7eef4; --ink-2:#aab6c1; --ink-3:#83909c;
    --accent:#3fbcc6; --accent-ink:#06282b; --accent-soft:#1b3a3e; --chip:#232b33;
    --ok:#39c49a; --warn:#e5ad2a; --crit:#f0664f; --shadow:0 6px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1a2026; --panel:rgba(24,30,37,.9); --panel-line:#36414b;
  --ink:#e7eef4; --ink-2:#aab6c1; --ink-3:#83909c;
  --accent:#3fbcc6; --accent-ink:#06282b; --accent-soft:#1b3a3e; --chip:#232b33;
  --ok:#39c49a; --warn:#e5ad2a; --crit:#f0664f; --shadow:0 6px 22px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 13px/1.35 'Barlow Semi Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(70,90,110,.14) 100%)}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leaders polyline{fill:none;stroke:var(--leader);stroke-width:1;stroke-opacity:.5;transition:opacity .2s}
#leaders circle{fill:#fff;stroke:var(--leader);stroke-width:1.2;transition:opacity .2s}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;border:1px solid rgba(23,34,44,.22);border-left:3px solid var(--ink-2);background:var(--tag-bg);color:var(--tag-ink);
  padding:3px 8px 3px 7px;border-radius:3px;font:600 11px/1.2 'Barlow Semi Condensed','Arial Narrow',sans-serif;letter-spacing:.05em;transition:opacity .2s;will-change:transform}
.tag.sensor{border-left-color:#0c7c86}
.tag.system{border-left-color:#3b4652}
.tag.on{background:#0c7c86;color:#fff;border-color:#0c7c86;border-left-color:#fff}
.tag.off{opacity:0;pointer-events:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#titleBlock{position:absolute;left:18px;top:14px;right:330px;pointer-events:none}
#titleBlock h1{margin:0;font-weight:600;font-size:19px;letter-spacing:.005em;color:var(--ink)}
#titleBlock p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
#panelLeft{left:16px;top:84px;width:238px;padding:12px 12px 10px;max-height:calc(100% - 170px);overflow:auto}
.group+.group{margin-top:12px;padding-top:11px;border-top:1px solid var(--panel-line)}
.group h2{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--panel-line);border-radius:5px;overflow:hidden;background:var(--chip)}
.seg button{flex:1;padding:6px 3px;background:transparent;border:0;color:var(--ink-2);cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--panel-line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,.tag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;cursor:pointer;color:var(--ink)}
.row input{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:9px;background:var(--panel-line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.row input::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.row input:checked{background:var(--accent)}
.row input:checked::after{transform:translateX(13px)}
.slider{margin-top:9px}
.slider label{display:flex;justify-content:space-between;color:var(--ink-2);margin-bottom:3px}
.slider output{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;color:var(--ink);font-size:12px}
input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
#camBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;padding:4px;gap:2px;max-width:calc(100% - 24px);overflow-x:auto}
#camBar button{background:transparent;border:0;border-radius:4px;padding:6px 11px;color:var(--ink-2);cursor:pointer;font-weight:500;white-space:nowrap}
#camBar button:hover{background:var(--chip);color:var(--ink)}
#camBar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#rightCol{position:absolute;right:16px;top:14px;width:290px;max-height:calc(100% - 28px);overflow:auto;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#rightCol .panel{position:relative;pointer-events:auto;padding:12px}
#rightCol h2{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.readouts{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0}
.readouts dt{color:var(--ink-2)}
.readouts dd{margin:0;text-align:right;font:500 13px 'IBM Plex Mono',ui-monospace,Menlo,monospace;color:var(--ink);font-variant-numeric:tabular-nums}
#riskPill{font-weight:600;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--ok);color:#fff}
#riskPill[data-r="WARNING"]{background:var(--warn)}
#riskPill[data-r="CRITICAL"]{background:var(--crit)}
#riskMsg{margin:8px 0 8px;color:var(--ink-2);min-height:34px}
.risk-sim{margin-top:2px}
.risk-sim .seg button[data-risk="NORMAL"][aria-pressed="true"]{background:var(--ok);color:#fff}
.risk-sim .seg button[data-risk="WARNING"][aria-pressed="true"]{background:var(--warn);color:#fff}
.risk-sim .seg button[data-risk="CRITICAL"][aria-pressed="true"]{background:var(--crit);color:#fff}
#flow{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--panel-line);padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
#flow li{position:relative;padding-left:14px;color:var(--ink-3);font-size:12px;transition:color .25s}
#flow li::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--panel-line);transition:background .25s,transform .25s}
#flow li.hot{color:var(--ink)}
#flow li.hot::before{background:var(--accent);transform:scale(1.25)}
#info{display:none}
#info.show{display:block}
#info h3{margin:0 24px 8px 0;font-size:15px;font-weight:600;letter-spacing:.01em}
#info dl{margin:0}
#info dt{font-size:12px;font-weight:600;color:var(--accent);margin-top:8px}
#info dd{margin:1px 0 0;color:var(--ink)}
#infoClose{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:4px;border:0;background:transparent;color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer}
#infoClose:hover{background:var(--chip)}
#hint{position:absolute;left:18px;bottom:22px;color:var(--ink-2);font-size:12.5px;pointer-events:none;transition:opacity .6s;max-width:260px}
#hint.gone{opacity:0}
#menuBtn{display:none;position:absolute;left:16px;top:70px;padding:7px 12px;border-radius:5px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--shadow);cursor:pointer;font-weight:600}
#fatal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;color:var(--ink);background:var(--bg);z-index:50}
#fatal[hidden]{display:none}
.tag small{display:none;margin-left:8px;font-weight:500;letter-spacing:.02em;text-transform:none;opacity:.72}
body.ex .tag small{display:inline}
.tag.on small{opacity:.9}
@media (max-width:900px){
  #titleBlock{right:16px}
  #titleBlock h1{font-size:16px}
  #rightCol{top:auto;bottom:66px;right:10px;left:10px;width:auto;max-height:44%}
  #rightCol .readouts{grid-template-columns:1fr auto 1fr auto;gap:2px 10px}
  #flow{display:none}
  #menuBtn{display:block;top:90px}
  #panelLeft{display:none;top:128px;left:10px;width:min(280px,calc(100% - 20px));max-height:calc(100% - 300px);z-index:5}
  #panelLeft.open{display:block}
  #hint{display:none}
  #camBar{bottom:12px}
}
@media (prefers-reduced-motion: reduce){ .tag,#leaders polyline,#leaders circle,#hint{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Interactive 3D model of a lithography machine"></div>
  <div id="vignette"></div>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>

  <header id="titleBlock">
    <h1>NanoPredict — Advanced Lithography Equipment Digital Twin</h1>
    <p>Sub-Nanometer Drift &amp; Vacuum Anomaly Prediction</p>
  </header>

  <button id="menuBtn" type="button" aria-expanded="false">Controls</button>

  <aside id="panelLeft" class="panel" aria-label="View controls">
    <div class="group">
      <h2>View</h2>
      <div class="seg" id="segView">
        <button type="button" data-view="normal" aria-pressed="true">Normal</button>
        <button type="button" data-view="transparent" aria-pressed="false">Transparent</button>
        <button type="button" data-view="exploded" aria-pressed="false">Exploded</button>
      </div>
      <label class="row" style="margin-top:6px"><span>Cutaway (front section removed)</span><input type="checkbox" id="tCut"></label>
    </div>
    <div class="group">
      <h2>Enclosure</h2>
      <div class="seg" id="segMat">
        <button type="button" data-mat="opaque" aria-pressed="false">Opaque</button>
        <button type="button" data-mat="semi" aria-pressed="true">Semi</button>
        <button type="button" data-mat="xray" aria-pressed="false">X-ray</button>
      </div>
      <div class="slider">
        <label for="transp"><span>Transparency</span><output id="transpOut">72%</output></label>
        <input type="range" id="transp" min="20" max="100" step="1" value="72">
      </div>
    </div>
    <div class="group">
      <h2>Show</h2>
      <label class="row"><span>Component labels</span><input type="checkbox" id="tLabels" checked></label>
      <label class="row"><span>Sensors</span><input type="checkbox" id="tSensors" checked></label>
      <label class="row"><span>Data flow</span><input type="checkbox" id="tFlow" checked></label>
      <label class="row"><span>Floor grid</span><input type="checkbox" id="tGrid" checked></label>
      <label class="row"><span>Animation</span><input type="checkbox" id="tPlay" checked></label>
      <label class="row"><span>Auto-rotate</span><input type="checkbox" id="tRotate"></label>
    </div>
  </aside>

  <div id="rightCol">
    <!-- NanoPredict telemetry monitor removed.
         The existing NanoPredict React telemetry UI will provide these values. -->
    <section class="panel" id="info" aria-live="polite">
      <button id="infoClose" type="button" aria-label="Close details">×</button>
      <h3 id="infoTitle"></h3>
      <dl>
        <dt>Purpose</dt><dd id="infoPurpose"></dd>
        <dt id="infoKLabel">Measured parameter</dt><dd id="infoParam"></dd>
        <dt>NanoPredict role</dt><dd id="infoRole"></dd>
      </dl>
    </section>
  </div>

  <nav id="camBar" class="panel" aria-label="Camera presets">
    <button type="button" data-cam="iso" aria-pressed="true">Isometric</button>
    <button type="button" data-cam="front" aria-pressed="false">Front</button>
    <button type="button" data-cam="back" aria-pressed="false">Back</button>
    <button type="button" data-cam="left" aria-pressed="false">Left</button>
    <button type="button" data-cam="right" aria-pressed="false">Right</button>
    <button type="button" data-cam="top" aria-pressed="false">Top</button>
    <button type="button" data-cam="bottom" aria-pressed="false">Bottom</button>
  </nav>

  <div id="hint">Drag to rotate, scroll to zoom, right-drag to pan. Click any part for details.</div>
  <div id="fatal" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function fatal(m){var f=$('#fatal');f.hidden=false;f.textContent=m}
if(!window.THREE||!THREE.OrbitControls){fatal('The 3D engine could not be loaded. Check your connection and reload the page.');return}
try{boot()}catch(e){console.error(e);fatal('The viewer could not start: '+e.message)}

function boot(){
const T=THREE, V3=T.Vector3;
const stage=$('#stage');
const darkMQ=window.matchMedia('(prefers-color-scheme: dark)');

/* ---------- renderer / scene / camera ---------- */
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.setClearColor(0x000000,0);
stage.appendChild(renderer.domElement);
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(30,1,.5,300);
const controls=new T.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.09;controls.rotateSpeed=.7;controls.zoomSpeed=.9;controls.panSpeed=.8;
controls.minDistance=5;controls.maxDistance=110;controls.minPolarAngle=0;controls.maxPolarAngle=Math.PI;
controls.mouseButtons={LEFT:T.MOUSE.ROTATE,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.PAN};
controls.touches={ONE:T.TOUCH.ROTATE,TWO:T.TOUCH.DOLLY_PAN};
controls.autoRotateSpeed=1.1;

/* ---------- studio environment (procedural softboxes, reflected by metal and glass) ---------- */
function makeEnv(){
  const s=new T.Scene();
  s.add(new T.Mesh(new T.SphereGeometry(45,32,16),new T.MeshBasicMaterial({color:0xc9d3dc,side:T.BackSide})));
  const ground=new T.Mesh(new T.CircleGeometry(44,32),new T.MeshBasicMaterial({color:0x6f7b86}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-14;s.add(ground);
  const soft=(w,h,x,y,z,k,col)=>{
    const m=new T.MeshBasicMaterial({color:col||0xffffff,side:T.DoubleSide});m.color.multiplyScalar(k);
    const p=new T.Mesh(new T.PlaneGeometry(w,h),m);p.position.set(x,y,z);p.lookAt(0,0,0);s.add(p);
  };
  soft(34,14,0,32,10,3.2);
  soft(14,24,-32,12,12,2.4);
  soft(14,24,32,10,-6,1.8,0xdff0ff);
  soft(30,9,0,7,-34,1.5);
  const pm=new T.PMREMGenerator(renderer);
  const tex=pm.fromScene(s,.03).texture;
  pm.dispose();
  return tex;
}
scene.environment=makeEnv();

/* ---------- lighting ---------- */
scene.add(new T.HemisphereLight(0xffffff,0x9aa5b0,.5));
const key=new T.DirectionalLight(0xffffff,1.0);
key.position.set(9,17,11);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:60});
key.shadow.bias=-.0004;key.shadow.normalBias=.03;key.shadow.radius=3;
scene.add(key);
const fill=new T.DirectionalLight(0xdfeaff,.35);fill.position.set(-10,7,5);scene.add(fill);
const rim=new T.DirectionalLight(0xcfe4ff,.6);rim.position.set(-4,9,-12);scene.add(rim);
const in1=new T.PointLight(0xfff3e0,.75,15,1.5);in1.position.set(0,5.6,2.4);scene.add(in1);
const in2=new T.PointLight(0xfff3e0,.6,12,1.5);in2.position.set(0,2.9,2.4);scene.add(in2);

/* ---------- floor ---------- */
const floor=new T.Group();scene.add(floor);
const shadowPlane=new T.Mesh(new T.PlaneGeometry(70,70),new T.ShadowMaterial({opacity:.2}));
shadowPlane.rotation.x=-Math.PI/2;shadowPlane.receiveShadow=true;floor.add(shadowPlane);
const grid=new T.GridHelper(44,44,0x8592a0,0xb4bec8);
grid.material.transparent=true;grid.material.opacity=.55;grid.material.depthWrite=false;grid.position.set(1.7,.004,0);floor.add(grid);
function themeFloor(){const d=darkMQ.matches&&document.documentElement.dataset.theme!=='light';
  grid.material.opacity=d?.28:.55;shadowPlane.material.opacity=d?.4:.2;}
themeFloor();
if(darkMQ.addEventListener)darkMQ.addEventListener('change',themeFloor);

/* ---------- textures ---------- */
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function canvasTex(w,h,draw,srgb){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);if(srgb!==false)t.encoding=T.sRGBEncoding;t.anisotropy=maxAniso;return t;}
const waferTex=canvasTex(1024,1024,(x,w,h)=>{
  const g=x.createRadialGradient(512,512,30,512,512,520);g.addColorStop(0,'#63739a');g.addColorStop(.6,'#42506f');g.addColorStop(1,'#2b3550');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  const dw=64,dh=80;
  for(let py=0;py<h;py+=dh)for(let px=0;px<w;px+=dw){x.fillStyle=((px/dw+py/dh)&1)?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';x.fillRect(px+2,py+2,dw-4,dh-4);}
  const ir=x.createLinearGradient(0,0,w,h);
  ir.addColorStop(0,'rgba(120,170,255,.20)');ir.addColorStop(.33,'rgba(190,120,255,.15)');ir.addColorStop(.66,'rgba(255,180,120,.13)');ir.addColorStop(1,'rgba(120,220,200,.18)');
  x.fillStyle=ir;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(200,214,232,.28)';x.lineWidth=1.5;
  for(let px=0;px<=w;px+=dw){x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke();}
  for(let py=0;py<=h;py+=dh){x.beginPath();x.moveTo(0,py);x.lineTo(w,py);x.stroke();}
});
const dotTex=canvasTex(64,64,(x)=>{x.clearRect(0,0,64,64);x.fillStyle='rgba(8,10,12,.75)';[[16,16],[48,16],[16,48],[48,48]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],3.2,0,7);x.fill();});});
dotTex.wrapS=dotTex.wrapT=T.RepeatWrapping;dotTex.repeat.set(16,11);
const threadTex=canvasTex(8,16,(x)=>{x.fillStyle='#8d959d';x.fillRect(0,0,8,16);x.fillStyle='#d9dfe4';x.fillRect(0,0,8,8);},true);
threadTex.wrapS=threadTex.wrapT=T.RepeatWrapping;threadTex.repeat.set(1,90);
const reticleTex=canvasTex(512,512,(x)=>{
  x.clearRect(0,0,512,512);x.fillStyle='#232a33';x.strokeStyle='#232a33';x.lineWidth=6;x.strokeRect(14,14,484,484);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const px=44+i*110,py=44+j*110;x.fillRect(px,py,86,86);x.clearRect(px+10,py+10,66,66);
    for(let k=0;k<5;k++)x.fillRect(px+16,py+16+k*12,54-((i+j+k)%3)*10,5);}
});

/* ---------- materials ---------- */
const std=o=>new T.MeshStandardMaterial(o);
const M={
  frame:std({color:0x2b3037,metalness:.8,roughness:.42}),
  dark:std({color:0x424952,metalness:.75,roughness:.5}),
  silver:std({color:0xc3cad1,metalness:.95,roughness:.3}),
  steel:std({color:0x9aa3ac,metalness:.9,roughness:.38}),
  chrome:std({color:0xeaf0f5,metalness:1,roughness:.06}),
  black:std({color:0x15181c,metalness:.3,roughness:.6}),
  granite:std({color:0x3b4249,metalness:.35,roughness:.55}),
  ceramic:std({color:0x252a30,metalness:.4,roughness:.42}),
  paint:std({color:0xdfe5ea,metalness:.15,roughness:.55}),
  teal:std({color:0x0c7c86,metalness:.5,roughness:.4}),
  sensor:std({color:0x2b3a47,metalness:.55,roughness:.45}),
  pcb:std({color:0x1c5a48,metalness:.3,roughness:.55}),
  gold:std({color:0xc8a24a,metalness:.9,roughness:.35}),
  terminal:std({color:0x2f7a58,metalness:.2,roughness:.6}),
  screw:std({map:threadTex,color:0xffffff,metalness:.9,roughness:.35}),
  dots:new T.MeshBasicMaterial({map:dotTex,transparent:true,depthWrite:false}),

/* ---------- geometry helpers ---------- */
function mk(geo,mat,x,y,z,parent,o){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);
  if(!(o&&o.noShadow)){m.castShadow=true;m.receiveShadow=true;}
  if(parent)parent.add(m);return m;}
const box=(w,h,d,mat,x,y,z,p,o)=>mk(new T.BoxGeometry(w,h,d),mat,x,y,z,p,o);
function cyl(rt,rb,h,mat,x,y,z,p,axis,seg,o){const m=mk(new T.CylinderGeometry(rt,rb,h,seg||32),mat,x,y,z,p,o);
  if(axis==='x')m.rotation.z=Math.PI/2;else if(axis==='z')m.rotation.x=Math.PI/2;return m;}
const sphere=(r,mat,x,y,z,p,o)=>mk(new T.SphereGeometry(r,16,12),mat,x,y,z,p,o);
function ringGeo(rOut,rIn,h,seg){const s=new T.Shape();s.absarc(0,0,rOut,0,Math.PI*2,false);
  const hl=new T.Path();hl.absarc(0,0,rIn,0,Math.PI*2,true);s.holes.push(hl);
  const g=new T.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:seg||48});g.rotateX(-Math.PI/2);g.translate(0,-h/2,0);return g;}
const ring=(rOut,rIn,h,mat,x,y,z,p,seg)=>mk(ringGeo(rOut,rIn,h,seg),mat,x,y,z,p);
function plateHole(w,d,h,hw,hd){const s=new T.Shape();s.moveTo(-w/2,-d/2);s.lineTo(w/2,-d/2);s.lineTo(w/2,d/2);s.lineTo(-w/2,d/2);s.closePath();
  const hl=new T.Path();hl.moveTo(-hw/2,-hd/2);hl.lineTo(-hw/2,hd/2);hl.lineTo(hw/2,hd/2);hl.lineTo(hw/2,-hd/2);hl.closePath();s.holes.push(hl);
  const g=new T.ExtrudeGeometry(s,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,-h/2,0);return g;}
function panelSolidGeo(w,h,wins,t){const s=new T.Shape();s.moveTo(-w/2,-h/2);s.lineTo(w/2,-h/2);s.lineTo(w/2,h/2);s.lineTo(-w/2,h/2);s.closePath();
  wins.forEach(a=>{const cx=a[0],cy=a[1],ww=a[2],hh=a[3],p=new T.Path();p.moveTo(cx-ww/2,cy-hh/2);p.lineTo(cx-ww/2,cy+hh/2);p.lineTo(cx+ww/2,cy+hh/2);p.lineTo(cx+ww/2,cy-hh/2);p.closePath();s.holes.push(p);});
  const g=new T.ExtrudeGeometry(s,{depth:t,bevelEnabled:false});g.translate(0,0,-t/2);return g;}
const UP=new V3(0,1,0);
function segMesh(a,b,r,mat,parent,seg){const d=new V3().subVectors(b,a),len=d.length();
  const m=new T.Mesh(new T.CylinderGeometry(r,r,len,seg||12),mat);m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(UP,d.normalize());m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
function bolts(n,radius,y,mat,parent,size,h){const im=new T.InstancedMesh(new T.CylinderGeometry(size||.06,size||.06,h||.06,6),mat,n);
  const d=new T.Object3D();for(let i=0;i<n;i++){const a=i/n*Math.PI*2;d.position.set(Math.cos(a)*radius,y,Math.sin(a)*radius);d.updateMatrix();im.setMatrixAt(i,d.matrix);}
  im.castShadow=true;parent.add(im);return im;}
function anchor(parent,x,y,z){const o=new T.Object3D();o.position.set(x,y,z);parent.add(o);return o;}

function vBeam(rt,rb,getTop,getBot,x,z,op){

  a.renderOrder=b.renderOrder=6;g.add(a);g.add(b);scene.add(g);beamMats.push([m1,o],[m2,o*1.9]);
  const upd=()=>{const t=getTop(),bt=getBot();g.scale.set(1,Math.max(.001,t-bt),1);g.position.set(x,(t+bt)/2,z);};

function staticBeam(rt,rb,len,mat1,mat2,x,y,z,parent,axis){

  for(let i=n;i>=0;i--){const r=i/n*R;pts.push(new T.Vector2(r,(e/2+c*(1-(r*r)/(R*R)))));}
  return new T.LatheGeometry(pts,40);}

  c.fillStyle='#8fa6b2';c.textAlign='left';c.font='500 18px "Barlow Semi Condensed",Arial,sans-serif';c.fillText('Drift trend',436,300);

const fmt={

/* =====================  NanoPredict telemetry bridge  ===================== */

let liveTelemetry = false;

window.addEventListener('message',(event)=>{
  if(event.origin !== window.location.origin)return;

  const data=event.data;

  if(event.source !== window.parent)return;

  liveTelemetry=true;

  if(Number.isFinite(Number(data.drift)))
  cur.d=Number(data.drift);

if(Number.isFinite(Number(data.vibration)))
  cur.v=Number(data.vibration);

if(Number.isFinite(Number(data.pressure)))
  cur.p=Number(data.pressure);

if(Number.isFinite(Number(data.temperature)))
  cur.t=Number(data.temperature);

  if(data.prediction?.horizon !== undefined)
    cur.h=Number(data.prediction.horizon);

  if(data.risk){
    const incomingRisk=String(data.risk).toUpperCase();

});
function setRisk(r){
  risk=r;const R=RISKS[r],st=GROUP_STATE[r];
  const pill=$('#riskPill');if(pill){pill.textContent=r;pill.dataset.r=r;}const msg=$('#riskMsg');if(msg)msg.textContent=R.msg;pressed('#segRisk','risk',r);
  leds.forEach(l=>{const h=STATE_HEX[st[l.group]];l.core.material.color.setHex(h);l.halo.material.color.setHex(h);});
  const hue={laser:st.laser,vib:st.vib,press:st.press,temp:st.temp};
  for(const k in cableMats)cableMats[k].emissive.setHex(k&&risk==='NORMAL'?0x0c7c86:STATE_HEX[hue[k]]);
  const on=[r==='NORMAL',r==='WARNING',r==='CRITICAL'];
  beaconMats.forEach((m,i)=>{m.emissiveIntensity=on[i]?1.4:0;});

/* =====================  enclosure modes, cutaway, explode  ===================== */

  panels.forEach(p=>{p.gl.visible=p.edges.visible=(mode!=='opaque');p.so.visible=p.wp.visible=(mode==='opaque');});

let viewMode='normal',exAnim=null;
function setExplode(to){exAnim={from:exF,to:to,t0:performance.now(),dur:1300};document.body.classList.toggle('ex',to>0);measureTags();}

/* =====================  camera presets  ===================== */
const DIRS={iso:[1,.78,1.15],front:[0,.1,1],back:[0,.1,-1],left:[-1,.1,0],right:[1,.1,0],top:[0,1,.02],bottom:[0,-1,.02]};
let preset='iso',tween=null;
function fitDist(){
  const ex=viewMode==='exploded',w=stage.clientWidth||1,h=stage.clientHeight||1,a=w/h,half=Math.tan(camera.fov*Math.PI/360);
  return Math.max((ex?10.6:7.2)/Math.sin(camera.fov*Math.PI/360),(ex?9.5:7.6)/(half*a));}
function camTarget(){return viewMode==='exploded'?new V3(1.8,6.0,.6):new V3(1.6,4.2,0);}
function camTo(name,dur){
  preset=name;pressed('#camBar','cam',name);
  const dir=new V3().fromArray(DIRS[name]).normalize(),tgt=camTarget(),toOff=dir.multiplyScalar(fitDist());
  const fromS=new T.Spherical().setFromVector3(camera.position.clone().sub(controls.target)),toS=new T.Spherical().setFromVector3(toOff);
  if(!dur){controls.target.copy(tgt);camera.position.copy(tgt).add(toOff);camera.lookAt(tgt);controls.update();tween=null;return;}
  tween={t0:performance.now(),dur:dur,fromT:controls.target.clone(),toT:tgt,fromS:fromS,toS:toS};}
function stepTween(now){
  if(!tween)return;const u=Math.min(1,(now-tween.t0)/tween.dur),e=u*u*(3-2*u),f=tween.fromS,t=tween.toS;
  let dth=t.theta-f.theta;if(dth>Math.PI)dth-=2*Math.PI;if(dth<-Math.PI)dth+=2*Math.PI;
  const s=new T.Spherical(f.radius+(t.radius-f.radius)*e,f.phi+(t.phi-f.phi)*e,f.theta+dth*e);
  controls.target.lerpVectors(tween.fromT,tween.toT,e);camera.position.setFromSpherical(s).add(controls.target);
  if(u>=1)tween=null;}
controls.addEventListener('start',()=>{tween=null;$('#hint').classList.add('gone');pressed('#camBar','cam','');});

/* =====================  selection, picking  ===================== */
let selId=null,selBox=null;const swapped=[];
function deepVisible(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function clearHighlight(){swapped.forEach(s=>{const m=s[0].material;s[0].material=s[1];m.dispose();});swapped.length=0;
  if(selBox){scene.remove(selBox);selBox.geometry.dispose();selBox=null;}}
function select(id){
  clearHighlight();selId=id;
  if(!id||!comps[id]){$('#info').classList.remove('show');selId=null;return;}
  const c=comps[id];
  if(id!=='enclosure'&&id!=='beacon')c.roots.forEach(r=>r.traverse(o=>{
    if(o.isMesh&&o.userData.comp===id&&o.material&&!Array.isArray(o.material)&&('emissive' in o.material)){
      swapped.push([o,o.material]);const m=o.material.clone();m.emissive=new T.Color(0x0c7c86);m.emissiveIntensity=.55;o.material=m;}}));
  selBox=new T.Box3Helper(new T.Box3(),0x0c7c86);selBox.material.depthTest=false;selBox.renderOrder=20;scene.add(selBox);
  $('#infoTitle').textContent=c.name;$('#infoPurpose').textContent=c.purpose;$('#infoParam').textContent=c.param;$('#infoRole').textContent=c.role;
  $('#info').classList.add('show');}
const _tb=new T.Box3();
function updateSelBox(){
  if(!selBox||!selId)return;const b=selBox.box;b.makeEmpty();
  comps[selId].roots.forEach(r=>r.traverse(o=>{if(o.isMesh&&o.userData.comp===selId&&deepVisible(o)){_tb.setFromObject(o);if(!_tb.isEmpty())b.union(_tb);}}));
  if(!b.isEmpty())b.expandByScalar(.06);selBox.visible=!b.isEmpty();}
const pickables=[];scene.traverse(o=>{if(o.isMesh&&o.userData.comp)pickables.push(o);});
const ray=new T.Raycaster(),ndc=new T.Vector2(),el=renderer.domElement;
function pickAt(cx,cy){
  const r=el.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,false).filter(h=>deepVisible(h.object));
  if(!hits.length){select(null);return;}
  let hit=hits[0];
  if(hit.object.userData.comp==='enclosure'&&!hit.object.userData.solid)hit=hits.find(h=>h.object.userData.comp!=='enclosure')||hits[0];
  const id=hit.object.userData.comp;select(id);if(id==='beacon')cycleRisk();}
let down=null;
el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
el.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y,dt=performance.now()-down.t;down=null;
  if(dx*dx+dy*dy<36&&dt<600)pickAt(e.clientX,e.clientY);});

const labelsEl=$('#labels'),leadersEl=$('#leaders'),NS='http://www.w3.org/2000/svg';
LBL.forEach(l=>{
  l.anchor=anchor(parts[l.host],l.pos[0],l.pos[1],l.pos[2]);
  const tag=document.createElement('div');tag.className='tag '+l.kind+' off';tag.setAttribute('role','button');tag.tabIndex=0;

  l.line=document.createElementNS(NS,'polyline');l.dot=document.createElementNS(NS,'circle');l.dot.setAttribute('r','2.8');

function measureTags(){setTimeout(()=>{LBL.forEach(l=>{l.w=l.tag.offsetWidth||150;l.h=l.tag.offsetHeight||22;});},60);}
let uiRects=[],uiTick=0,labelsOn=true,sensorsOn=true,flowOn=true;
function refreshUI(){uiRects=[];['#panelLeft','#rightCol .panel','#camBar','#titleBlock h1','#titleBlock p','#menuBtn'].forEach(s=>$$(s).forEach(e=>{
  if(e.offsetParent===null)return;const r=e.getBoundingClientRect();if(r.width>0)uiRects.push({x:r.left,y:r.top,w:r.width,h:r.height});}));}
const hit=(a,b,p)=>a.x<b.x+b.w+p&&a.x+a.w+p>b.x&&a.y<b.y+b.h+p&&a.y+a.h+p>b.y;
const _v=new V3();
function layoutLabels(){
  if(uiTick++%20===0)refreshUI();
  const W=stage.clientWidth,H=stage.clientHeight,cx=W/2,cy=H/2,cap=selId?5:(viewMode==='exploded'?18:12),placed=[];let shown=0;
  const sr=stage.getBoundingClientRect();
  LBL.forEach(l=>{l.anchor.getWorldPosition(_v);_v.project(camera);l.sx=(_v.x*.5+.5)*W;l.sy=(-_v.y*.5+.5)*H;l.ok=_v.z<1&&l.sx>0&&l.sx<W&&l.sy>0&&l.sy<H;});
  const order=LBL.slice().sort((a,b)=>((b.comp===selId)-(a.comp===selId))||(a.prio-b.prio));
  order.forEach(l=>{
    let ok=l.ok&&(labelsOn||l.comp===selId)&&(!l.sensorPart||sensorsOn);
    if(ok&&l.comp!==selId&&shown>=cap)ok=false;
    let best=null;
    if(ok){const dx0=l.sx<cx?-1:1,dy0=l.sy<cy?-1:1,cands=[[dx0,dy0],[-dx0,dy0],[dx0,-dy0],[-dx0,-dy0]];
      for(let i=0;i<cands.length&&!best;i++){const c=cands[i],x=c[0]>0?l.sx+34:l.sx-34-l.w,y=l.sy+c[1]*26-l.h/2,r={x:x,y:y,w:l.w,h:l.h};
        if(x<4||y<4||x+l.w>W-4||y+l.h>H-4)continue;
        if(placed.some(p=>hit(r,p,5)))continue;
        const abs={x:x+sr.left,y:y+sr.top,w:l.w,h:l.h};if(l.comp!==selId&&uiRects.some(u=>hit(abs,u,2)))continue;

    if(best){shown++;placed.push({x:best.x,y:best.y,w:l.w,h:l.h});
      l.tag.style.transform='translate('+best.x.toFixed(1)+'px,'+best.y.toFixed(1)+'px)';l.tag.classList.remove('off');
      const ex=best.c[0]>0?best.x:best.x+l.w,ey=best.y+l.h/2;
      l.line.setAttribute('points',l.sx.toFixed(1)+','+l.sy.toFixed(1)+' '+(ex-best.c[0]*12).toFixed(1)+','+ey.toFixed(1)+' '+ex.toFixed(1)+','+ey.toFixed(1));
      l.dot.setAttribute('cx',l.sx.toFixed(1));l.dot.setAttribute('cy',l.sy.toFixed(1));l.line.style.opacity=l.dot.style.opacity=1;}
    else{l.tag.classList.add('off');l.line.style.opacity=l.dot.style.opacity=0;}

/* =====================  animation loop  ===================== */
function resize(){const w=stage.clientWidth||1,h=stage.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
resize();

let time=0,last=performance.now(),lastDom=0,flowIdx=-1;
const jit=(t,k,a)=>(Math.sin(t*61+k)+Math.sin(t*97+k*2.3))*.5*a;
function animateScene(dt){
  if(playing)time+=dt;const t=time,R=RISKS[risk];
  if(playing){
    const sx=.32*Math.sin(t*.9);

const a=.0012+(normalizedVibration*.016);
    waferMover.position.x=sx+jit(t,0,a);waferPlatform.position.z=sz+jit(t,1,a);carriageG.position.x=sx+jit(t,0,a);
    reticleCar.position.x=-sx*1.6+jit(t,2,a)*.5;opticsCol.position.x=jit(t,3,a)*.6;opticsCol.position.z=jit(t,4,a)*.6;}
  updateLasers();
  const k=1-Math.exp(-dt*3);
  const stg=Math.floor((t/.9)%7);
  const active=['laser','vib','press','temp'][stg];
  if(flowOn&&sensorsOn){
    for(const g in cableMats)cableMats[g].emissiveIntensity+=((g===active?1.1:.12)-cableMats[g].emissiveIntensity)*Math.min(1,dt*8);
    CABLES.forEach((c,i)=>{const on=c.g===active;for(let j=0;j<PPC;j++){
      const u=((t*.2+j/PPC+i*.13)%1);c.curve.getPointAt(u,_pm.position);_pm.scale.setScalar(on?1.7:.8);_pm.updateMatrix();pulses.setMatrixAt(i*PPC+j,_pm.matrix);}});
    pulses.instanceMatrix.needsUpdate=true;}
  if(stg!==flowIdx){flowIdx=stg;flowLis.forEach((li,i)=>li.classList.toggle('hot',flowOn&&i===stg));}
  leds.forEach((l,i)=>{const b=.6+.4*Math.sin(t*4+i);l.core.scale.setScalar(.85+.3*b);l.halo.material.opacity=.12+.2*b;});
  const flick=.9+.1*Math.sin(t*3);beamMats.forEach(m=>{m[0].opacity=m[1]*flick;});
  beaconMats[RISK_ORDER.indexOf(risk)].emissiveIntensity=(stg===6)?2.4:1.4;
  if(stg===5)engMat.color.setHex(0xffffff);else engMat.color.setHex(STATE_HEX[GROUP_STATE[risk].unit]);
}
function updateReadouts(now){
  if(now-lastDom<250)return;
  lastDom=now;

  $('#rDrift').textContent=fmt.d();
  $('#rVib').textContent=fmt.v();
  $('#rPress').textContent=fmt.p();
  $('#rTemp').textContent=fmt.t();
  $('#rHor').textContent=fmt.h();

  hist.push(cur.d);
  if(hist.length>60)hist.shift();

  drawDisplay();
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  stepTween(now);stepExplode(now);animateScene(dt);updateReadouts(now);
  controls.update();updateSelBox();renderer.render(scene,camera);layoutLabels();}

/* initial state: isometric, transparent enclosure, sensors active, data flow running */
applyExplode(0);setEnclosure('semi',72);setRisk('NORMAL');camTo('iso',0);measureTags();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawDisplay();measureTags();});

}
